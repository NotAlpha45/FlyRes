[versions]
java = "21"
javafx = "21.0.13"
atlantafx = "2.1.0"
sqlite = "3.54.1.0"
junit = "5.14.4"
archunit = "1.5.1"

[libraries]
atlantafx = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
